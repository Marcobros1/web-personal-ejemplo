name: ci

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
     
      - name: Instalar dependencias
        run: npm ci
  
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      #- name: Build de la imagen Docker
      #  run: docker build -t web:pr-${{ github.event.number }} .

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}